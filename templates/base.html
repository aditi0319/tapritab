<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TapriTab{% endblock title %} | TapriTab</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --chai: #8b4513; --chai-light: #fdf6ec; }
        body { background: var(--chai-light); }
        .navbar { background: var(--chai); }
        .btn-chai { background: var(--chai); color: #fff; }
        .btn-chai:hover { background: #6f370f; color: #fff; }
        .tt-form input, .tt-form select, .tt-form textarea {
            display: block; width: 100%; padding: .5rem .75rem;
            border: 1px solid #d6c3ad; border-radius: .5rem; background: #fff;
        }
        .tt-form ul { padding-left: 1.2rem; margin-bottom: 0; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'home' %}">☕ TapriTab</a>
        <div class="d-flex align-items-center gap-2">
            {% if user.is_authenticated %}
                <a class="btn btn-sm btn-light" href="{% url 'accounts:profile' %}">{{ user.username }}</a>
                <form method="post" action="{% url 'logout' %}" class="m-0">
                    {% csrf_token %}
                    <button class="btn btn-sm btn-outline-light" type="submit">Logout</button>
                </form>
            {% else %}
                <a class="btn btn-sm btn-outline-light" href="{% url 'login' %}">Login</a>
                <a class="btn btn-sm btn-light" href="{% url 'accounts:register' %}">Register</a>
            {% endif %}
        </div>
    </div>
</nav>

<main class="container">
    {% for message in messages %}
        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %}">{{ message }}</div>
    {% endfor %}

    {% block content %}{% endblock content %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
