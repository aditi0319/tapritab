{% extends "base.html" %}
{% block title %}Register{% endblock title %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm p-4">
            <h2 class="mb-3">Create your account</h2>
            <form method="post" class="tt-form">
                {% csrf_token %}
                {% include "includes/form_fields.html" %}
                <button class="btn btn-chai w-100" type="submit">Register</button>
            </form>
            <p class="mt-3 mb-0">Already have an account? <a href="{% url 'login' %}">Login</a></p>
        </div>
    </div>
</div>
{% endblock content %}
