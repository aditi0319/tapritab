{% extends "base.html" %}
{% block title %}Login{% endblock title %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm p-4">
            <h2 class="mb-3">Login</h2>
            <form method="post" class="tt-form">
                {% csrf_token %}
                {% include "includes/form_fields.html" %}
                <input type="hidden" name="next" value="{{ next }}">
                <button class="btn btn-chai w-100" type="submit">Login</button>
            </form>
            <p class="mt-3 mb-0">New here? <a href="{% url 'accounts:register' %}">Create an account</a></p>
        </div>
    </div>
</div>
{% endblock content %}
