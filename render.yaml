databases:
  - name: tapritab-db
    plan: free
    region: singapore
    databaseName: tapritab
    user: tapritab

services:
  - type: web
    name: tapritab
    runtime: python
    plan: free
    region: singapore
    autoDeployTrigger: checksPass
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --no-input &&
      python manage.py migrate &&
      (python manage.py createsuperuser --no-input || true)
    startCommand: gunicorn tapritab_project.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        fromDatabase:
          name: tapritab-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 2
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false